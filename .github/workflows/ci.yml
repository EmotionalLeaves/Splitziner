name: CI

# Every push to main is tested and built. If the top "## vX.Y.Z" heading in CHANGELOG.md
# has no release yet, the same run publishes the APK as that release: bump the changelog,
# push, done. One job on purpose: two jobs downloading dependencies at once get rate-limited.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tests, APK, release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Work out version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## v//')
          [ -z "$VERSION" ] && VERSION=0.0.1
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "pull_request" ] || gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VERSION: build only"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "v$VERSION: will be released"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test & build
        run: |
          set -o pipefail
          # Dependency hosts sometimes answer 429 (too many requests); what was fetched stays cached, so retry.
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon --stacktrace -PversionName="$VERSION" :core:test :app:assembleRelease 2>&1 | tee build-output.txt; then exit 0; fi
            if ! grep -qE "HTTP 429|was not found in any of the following sources|Could not resolve|Could not GET" build-output.txt; then exit 1; fi
            echo "Dependency download failed (attempt $attempt); retrying in 30 s"; sleep 30
          done
          exit 1

      - name: Collect and verify
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Splitziner-$VERSION.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "out/Splitziner-$VERSION.apk" | head -3

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.release == 'true'
        run: |
          awk -v v="## v$VERSION" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          **Install:** open this page on your phone, tap the `.apk` under Assets, and allow the install when Android asks. It installs over the previous version and keeps your projects.
          NOTES

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Splitziner v${{ env.VERSION }}
          body_path: notes.md
          files: out/*.apk

      - name: Report the result on the commit
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          RELEASED: ${{ steps.version.outputs.release }}
        run: |
          {
            echo "### CI $STATUS (v$VERSION, released: $RELEASED)"
            if [ "$STATUS" != "success" ] && [ -f build-output.txt ]; then
              echo '```'
              grep -A3 -E "^e: |error:|FAILED|What went wrong|AssertionError" build-output.txt | grep -v "^\s*at " | head -100 || true
              echo '```'
              echo 'Tail:'
              echo '```'
              grep -v "^\s*at " build-output.txt | tail -40
              echo '```'
            fi
          } | head -c 60000 > result.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat result.md)" > /dev/null

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            core/build/golden-actual
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: splitziner-apk
          path: out/*.apk
          if-no-files-found: error

  # The app is run for real on an emulated phone: it opens a cabinet and a real desk file, visits every
  # tab, fixes the desk and makes each export. It runs after the build so the two do not compete for
  # downloads, and does not hold up the release: its result is posted on the commit.
  device:
    name: Run on an emulated phone
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test app
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee build-output.txt; then exit 0; fi
            if ! grep -qE "HTTP 429|was not found in any of the following sources|Could not resolve|Could not GET" build-output.txt; then exit 1; fi
            sleep 30
          done
          exit 1
      - name: Run on the emulator
        id: run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          script: |
            adb logcat -c
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > device-output.txt 2>&1; echo $? > device-exit.txt
            tail -60 device-output.txt
            adb logcat -d > logcat.txt || true
            mkdir -p shots; adb pull /sdcard/Android/data/io.github.emotionalleaves.splitziner/files/shots shots/ || true
            exit $(cat device-exit.txt)
      - name: Report the result on the commit
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Device test $STATUS"
            echo '```'
            grep -h "SMOKE" logcat.txt 2>/dev/null | sed 's/.*SMOKE/SMOKE/' | sort -u | head -20 || true
            if [ "$STATUS" != "success" ]; then
              python3 scripts/test-failures.py || true
              grep -hE "FAILED|Tests run|failed" device-output.txt 2>/dev/null | head -20 || true
              grep -h -A12 "FATAL EXCEPTION" logcat.txt 2>/dev/null | head -60 || true
              grep -hE "^e: |What went wrong" -A3 build-output.txt 2>/dev/null | head -30 || true
            fi
            echo '```'
          } | head -c 60000 > result.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat result.md)" > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            logcat.txt
            shots
          if-no-files-found: ignore


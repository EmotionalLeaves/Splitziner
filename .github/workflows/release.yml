name: Release

# A release happens when main gets a CHANGELOG.md whose top "## vX.Y.Z" heading has no
# release yet: bump the changelog, push, done. CI builds the APK and publishes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Work out version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## v//')
          if [ -z "$VERSION" ]; then echo "No version heading in CHANGELOG.md"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing v$VERSION"

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.skip != 'true'
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Test and build the signed APK
        if: steps.version.outputs.skip != 'true'
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace -PversionName="$VERSION" :core:test :app:assembleRelease 2>&1 | tee build-output.txt

      - name: Collect and verify
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Splitziner-$VERSION.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "out/Splitziner-$VERSION.apk" | head -3

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.skip != 'true'
        run: |
          awk -v v="## v$VERSION" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          **Install:** open this page on your phone, tap the `.apk` under Assets, and allow the install when Android asks. It installs over the previous version and keeps your projects.
          NOTES

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip != 'true'
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Splitziner v${{ env.VERSION }}
          body_path: notes.md
          files: out/*.apk

      - name: Report the result on the commit
        if: always() && steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Release v$VERSION: $STATUS"
            if [ "$STATUS" != "success" ] && [ -f build-output.txt ]; then
              echo '```'
              grep -A3 -E "^e: |error:|FAILED|What went wrong|AssertionError" build-output.txt | head -100 || true
              tail -40 build-output.txt
              echo '```'
            fi
          } | head -c 60000 > result.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat result.md)" > /dev/null
